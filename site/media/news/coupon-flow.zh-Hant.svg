<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-label="誰付錢、誰保管什麼" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'PingFang TC', 'Noto Sans CJK TC', 'Noto Sans JP', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245E3E"/></marker></defs><rect width="760" height="476" rx="22" fill="#F1F5EE"/><text x="380" y="46" font-size="22" font-weight="700" fill="#1D2B22" text-anchor="middle">誰付錢、誰保管什麼</text><rect x="40" y="80" width="260" height="110" rx="18" fill="#FBEFD5"/><text x="170.0" y="116" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">開發者</text><text x="170.0" y="144" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">為自己的 App</text><text x="170.0" y="166" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">發行 Coupon</text><rect x="460" y="80" width="260" height="110" rx="18" fill="#FFFFFF"/><text x="590.0" y="116" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">模型供應商</text><text x="590.0" y="144" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">依實際用量</text><text x="590.0" y="166" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">向開發者收費</text><rect x="40" y="270" width="260" height="110" rx="18" fill="#E4EFE0"/><text x="170.0" y="306" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">Keyala</text><text x="170.0" y="334" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">保管開發者的 key</text><text x="170.0" y="356" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">並執行額度上限</text><rect x="460" y="270" width="260" height="110" rx="18" fill="#FFFFFF"/><text x="590.0" y="306" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">你</text><text x="590.0" y="334" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">安裝 Keyala、領券</text><text x="590.0" y="356" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">不必綁 API key</text><line x1="304" y1="135" x2="454" y2="135" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="380" y="124" font-size="14" font-weight="600" fill="#245E3E" text-anchor="middle">直接付款</text><line x1="170" y1="194" x2="170" y2="264" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="182" y="234" font-size="14" font-weight="600" fill="#245E3E" text-anchor="start">key + 上限</text><line x1="304" y1="325" x2="454" y2="325" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="380" y="314" font-size="14" font-weight="600" fill="#245E3E" text-anchor="middle">只能用在該 App</text><line x1="40" y1="414" x2="720" y2="414" stroke="#E2E9DF" stroke-width="2" stroke-dasharray="6 6"/><text x="380" y="446" font-size="15" font-weight="600" fill="#4F5F54" text-anchor="middle">金錢不經過 Keyala。開發者的 key 也不會交到你手上。</text></svg>
