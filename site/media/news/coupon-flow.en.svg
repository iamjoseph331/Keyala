<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-label="Who pays, and who holds what" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'PingFang TC', 'Noto Sans CJK TC', 'Noto Sans JP', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245E3E"/></marker></defs><rect width="760" height="476" rx="22" fill="#F1F5EE"/><text x="380" y="46" font-size="22" font-weight="700" fill="#1D2B22" text-anchor="middle">Who pays, and who holds what</text><rect x="40" y="80" width="260" height="110" rx="18" fill="#FBEFD5"/><text x="170.0" y="116" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">Developer</text><text x="170.0" y="144" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">Issues coupons for</text><text x="170.0" y="166" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">their own app</text><rect x="460" y="80" width="260" height="110" rx="18" fill="#FFFFFF"/><text x="590.0" y="116" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">Model provider</text><text x="590.0" y="144" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">Bills the developer</text><text x="590.0" y="166" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">for actual usage</text><rect x="40" y="270" width="260" height="110" rx="18" fill="#E4EFE0"/><text x="170.0" y="306" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">Keyala</text><text x="170.0" y="334" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">Keeps the developer&#x27;s key</text><text x="170.0" y="356" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">and enforces the limits</text><rect x="460" y="270" width="260" height="110" rx="18" fill="#FFFFFF"/><text x="590.0" y="306" font-size="19" font-weight="700" fill="#1D2B22" text-anchor="middle">You</text><text x="590.0" y="334" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">Install Keyala, claim</text><text x="590.0" y="356" font-size="15" font-weight="400" fill="#4F5F54" text-anchor="middle">a coupon, no API key</text><line x1="304" y1="135" x2="454" y2="135" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="380" y="124" font-size="14" font-weight="600" fill="#245E3E" text-anchor="middle">pays directly</text><line x1="170" y1="194" x2="170" y2="264" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="182" y="234" font-size="14" font-weight="600" fill="#245E3E" text-anchor="start">key + limits</text><line x1="304" y1="325" x2="454" y2="325" stroke="#245E3E" stroke-width="2.5" marker-end="url(#a)"/><text x="380" y="314" font-size="14" font-weight="600" fill="#245E3E" text-anchor="middle">uses that app only</text><line x1="40" y1="414" x2="720" y2="414" stroke="#E2E9DF" stroke-width="2" stroke-dasharray="6 6"/><text x="380" y="446" font-size="15" font-weight="600" fill="#4F5F54" text-anchor="middle">Money never passes through Keyala. The developer&#x27;s key is never handed to you.</text></svg>
