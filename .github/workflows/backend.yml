name: Backend CI

# Render deploys main (prod) and staging only after these checks pass (autoDeployTrigger: checksPass).
on:
  push:
    branches: [dev, staging, main]
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml", "site/examples/**", "site/base.css", "site/i18n.js", "tools/plaza.test.mjs", "tools/site/build-plaza.mjs"]
  pull_request:
    branches: [dev, staging, main]
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml", "site/examples/**", "site/base.css", "site/i18n.js", "tools/plaza.test.mjs", "tools/site/build-plaza.mjs"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/coupon_ui.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Render will run, then hit /healthz
        run: |
          docker build -t keyala:ci backend
          docker run -d --name keyala -p 8080:8080 -e KEYALA_MASTER_KEY="$(openssl rand -base64 32)" keyala:ci
          for i in $(seq 30); do curl -sf localhost:8080/healthz && exit 0; sleep 1; done
          docker logs keyala; exit 1

  plaza-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/site --ignore-scripts --no-audit --no-fund
      - run: node tools/site/build-plaza.mjs --check
      - run: node --test tools/plaza.test.mjs
