name: Publish developer page

on:
  push:
    branches: [main]
    paths: ["site/**", "examples/resume-tailor/**", "tools/build_news.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # site/ at the root, static example apps under /examples/ (e.g. /examples/resume-tailor/)
      - run: |
          mkdir -p _site/examples
          cp -R site/. _site/
          cp -R examples/resume-tailor _site/examples/
          python3 tools/build_news.py --test
          python3 tools/build_news.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
