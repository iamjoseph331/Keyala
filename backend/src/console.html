<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Keyala console</title>
<style>
/* D3 "warm receipt" look, matching keyala.io. Light only. System fonts: the CSP keeps everything on this origin. */
:root{--paper:#F1F5EE;--card:#fff;--soft:#F4F7F2;--ink:#1D2B22;--muted:#4F5F54;--line:#E2E9DF;--green:#245E3E;--green-ink:#fff;--green-soft:#E4EFE0;--sun:#FBEFD5;--sun-ink:#5C4A26;--bad:#A0412A;--heat:36,94,62;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","PingFang TC",sans-serif}
main{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
header h1,h2.big{font-family:ui-serif,"New York",Georgia,"Hiragino Mincho ProN",serif;font-weight:700;letter-spacing:-.02em;margin:0}
header h1{font-size:clamp(1.8rem,4vw,2.6rem);flex:1;min-width:12em}
h2{font-size:1.15rem;margin:28px 0 10px}h3{font-size:1.05rem;margin:16px 0 8px}
.card{background:var(--card);border:0;border-radius:22px;padding:22px 24px;margin:10px 0}
.muted{color:var(--muted);font-size:.92rem}.bad{color:var(--bad)}
button,input,select{font:inherit;color:inherit}
button{border:1.5px solid #D3DDD0;background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;min-height:44px;font-weight:600}
button:hover{border-color:var(--green)}
button.primary{background:var(--green);color:var(--green-ink);border-color:var(--green);font-weight:700;padding:10px 24px}
button.danger{color:var(--bad);border-color:#E7C3B6}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
input,select{width:100%;border:1.5px solid #D3DDD0;background:#fff;border-radius:14px;padding:12px 14px;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(36,94,62,.15)}
input::placeholder{color:#7A887E}
label{display:block;margin:16px 0 6px;font-weight:600}
label input{margin-top:6px;font-size:1rem;font-weight:400;color:var(--ink)}
.hint{display:block;margin-top:6px;font-weight:400;font-size:.88rem;color:var(--muted)}
.note{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:18px;background:var(--sun);color:var(--sun-ink);margin:0 0 8px}
.note svg{flex-shrink:0}
.empty{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.empty svg{flex-shrink:0}
.empty b{display:block;font-family:ui-serif,"New York",Georgia,serif;font-size:1.3rem;margin-bottom:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.82rem;font-weight:700;margin-left:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:20px;align-items:start}
.cols .card{margin:0}
.stack{display:grid;gap:20px}
.tip{background:var(--sun);color:var(--sun-ink)}
.tip ul{margin:0;padding-left:18px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.reqhead{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;min-height:0;padding:12px 0;font:inherit;font-weight:400;color:inherit;cursor:pointer}
.reqhead>span{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{min-width:0;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:16px 18px;background:var(--card);border-radius:18px}.stat b{display:block;font-family:ui-serif,"New York",Georgia,serif;font-size:1.6rem;color:var(--green)}
.qr{display:block;margin:12px auto;width:220px;max-width:100%;height:auto;aspect-ratio:1;background:#fff;border-radius:14px;padding:8px;border:1.5px solid var(--line)}
.secret{font-family:ui-monospace,monospace;font-size:.85rem;word-break:break-all;background:var(--soft);border-radius:12px;padding:12px;margin:10px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:12px;padding:12px;max-height:260px;overflow:auto;font-size:.82rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px;background:var(--card);border-radius:18px;padding:14px}
.bars i{flex:1;background:var(--green);min-height:1px;border-radius:3px 3px 0 0}
.heat{display:grid;grid-template-columns:2.4em repeat(24,1fr);gap:2px;font-size:.68rem;background:var(--card);border-radius:18px;padding:14px}
.heat span{aspect-ratio:1;border-radius:3px;background:rgba(var(--heat),var(--a,0));min-width:0;outline:1px solid var(--line)}
.heat em{font-style:normal;color:var(--muted);align-self:center}
.err{color:var(--bad);margin:8px 0}
.top{border-bottom:1px solid var(--line);background:var(--card)}
.top div{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top a{color:var(--ink);text-decoration:none;font-weight:500}
.top .brand{display:flex;align-items:center;gap:10px;font-family:ui-serif,"New York",Georgia,serif;font-weight:700;font-size:1.25rem;margin-right:auto}
.top .brand small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:500;font-size:.95rem;color:var(--muted)}
.tabs{display:inline-flex;gap:4px;padding:5px;background:var(--card);border-radius:999px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;border-radius:999px;background:none;min-height:40px}
.tabs button[aria-selected=true]{background:var(--green);color:var(--green-ink);font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.chead h2{font-size:1.6rem}
.cpanes{display:grid;grid-template-columns:minmax(220px,.42fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.cpanes{grid-template-columns:minmax(0,1fr)}}
.blist{padding:8px;margin:0}
.bitem{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;text-align:left;border:0;border-radius:16px;background:none;padding:12px 14px;min-height:0;font-weight:400}
.bitem[aria-current]{background:var(--green-soft)}
.bline{display:flex;justify-content:space-between;gap:8px}
.st{font-size:.8rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.st-active{color:var(--green)}.st-full,.st-closed{color:var(--sun-ink)}.st-stopped,.st-revoked{color:var(--bad)}
.bcard{display:flex;gap:24px;flex-wrap:wrap;align-items:center;margin:0}
.bcard .qr{margin:0;width:148px}
.bmain{flex:1 1 300px;min-width:0;display:grid;gap:10px}
.linkrow{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:6px 6px 6px 14px}
.linkrow a{flex:1;min-width:0;font-size:.85rem;color:var(--ink)}
a.btn{display:inline-flex;align-items:center;border:1.5px solid #D3DDD0;border-radius:999px;padding:8px 18px;min-height:44px;font-weight:600;color:var(--ink);text-decoration:none}
a.btn:hover{border-color:var(--green)}
.flow{display:flex;gap:2px;height:22px;border-radius:11px;overflow:hidden;background:var(--line)}
.flow i{display:block}
.f-spent{background:var(--green)}.f-held{background:#E8961F}.f-hands{background:#8DB89A}.f-avail{background:var(--line)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px}
.legend span{display:flex;gap:6px;align-items:center;font-size:.85rem}
.legend i{display:block;width:10px;height:10px;border-radius:3px;outline:1px solid #D3DDD0}
.legend b{font-family:ui-serif,"New York",Georgia,serif;font-size:1.35rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stack>.card,.cols2>.card{margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;font-size:1.05rem;padding:0}
fieldset+fieldset{margin-top:24px}
.bitem .mono{font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
@media(max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
label.check{display:flex;gap:12px;align-items:flex-start;margin:22px 0 0}
.check input{width:22px;height:22px;min-height:0;flex:none;margin:2px 0 0;accent-color:var(--green)}
.check .hint{color:var(--sun-ink)}
.model-field{margin-top:16px}
.model-field>legend{font-size:1rem;font-weight:600;margin-bottom:6px}
.model-picker{border:1.5px solid #D3DDD0;border-radius:14px;background:#fff;font-weight:400}
.model-picker summary{padding:12px 14px;min-height:46px;cursor:pointer;overflow-wrap:anywhere}
.model-picker summary:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:14px}
.model-options{max-height:220px;overflow:auto;padding:0 14px 12px}
.model-options label.check{margin:10px 0 0;overflow-wrap:anywhere}

.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.ticket{background:var(--card);border-radius:22px;box-shadow:0 8px 24px rgba(29,43,34,.08)}
.ttop{padding:20px 20px 14px;display:grid;justify-items:center;gap:4px;text-align:center}
.ttop .chip{margin:6px 0 0}
.tile{width:40px;height:40px;border-radius:12px;background:#3D7A57;color:#fff;display:grid;place-items:center;font-weight:800}
.tamt{font-family:ui-serif,"New York",Georgia,serif;font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--green)}
.perf{position:relative;height:20px}
.perf::before{content:"";position:absolute;left:16px;right:16px;top:9px;border-top:2px dashed var(--line)}
.perf b{position:absolute;top:0;width:20px;height:20px;border-radius:10px;background:var(--paper)}
.perf b:first-child{left:-10px}.perf b:last-child{right:-10px}
.trows{padding:8px 20px 18px;font-size:.9rem}
.trows .kv{padding:5px 0}
.kv.total{border-top:2px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:700}
</style>
</head>
