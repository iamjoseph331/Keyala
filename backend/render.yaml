# Render blueprint. SQLite needs a persistent disk, otherwise data resets on every deploy.
# (Persistent disks require a paid instance type.)
services:
  - type: web
    name: masterkey
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend          # remove if this file is used from backend/ as the repo root
    healthCheckPath: /healthz
    disk:
      name: masterkey-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MK_MASTER_KEY    # base64 of 32 bytes: `openssl rand -base64 32`. LOSING IT LOSES ALL STORED API KEYS.
        sync: false
      - key: MK_DATABASE_URL
        value: sqlite:///data/masterkey.db?mode=rwc
      - key: MK_PUBLIC_URL    # your service URL, used to build connect links
        sync: false
      - key: MK_DEV_LOGIN     # 1 enables /v1/auth/dev (testing only; anyone can log in as any email)
        value: "0"
      - key: MK_VENDOR_MOCK   # 1 fakes OpenAI/Anthropic responses (demos)
        value: "0"
      - key: MK_PRICES_VERIFIED # set to 1 only after checking src/pricing.rs against vendor pricing pages
        value: "0"
      - key: MK_APPLE_BUNDLE_ID
        value: app.masterkey.ios
      - key: MK_APNS_KEY_P8     # contents of the AuthKey_XXXX.p8 (optional: no key = no push)
        sync: false
      - key: MK_APNS_KEY_ID
        sync: false
      - key: MK_APNS_TEAM_ID
        sync: false
      - key: MK_APNS_TOPIC
        value: app.masterkey.ios
      - key: MK_APNS_SANDBOX    # 1 for development-signed builds
        value: "0"
      # PORT is set by Render automatically.
