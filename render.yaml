# Render Blueprint for the Keyala backend.
# main -> masterkey-prod, staging -> masterkey-staging. `dev` is CI-only (no deploy).
#
# prod: starter + 1 GB disk at /var/data (compute upgraded by Joseph; disk pending his confirmation,
# see docs/ops/PRODUCTION.md). Existing free-plan prod data is NOT carried over (owner accepted the reset).
# staging: free plan, no disk (disk deleted and plan downgraded by Joseph, 2026-11-20): data resets on deploy/restart/sleep.
# Temporary legacy identifiers kept on purpose (see docs/ops/KEYALA_CUTOVER.md): service names masterkey-prod and
# masterkey-staging (Blueprint matches services by name; rename in the Dashboard first, then here), the secret name
# MK_MASTER_KEY (the code reads KEYALA_MASTER_KEY first, then this), prod's database file /var/data/masterkey.db, and the Apple bundle id / APNs topic app.sorevan.masterkey.
#
# Secrets: MK_MASTER_KEY (legacy name, see above) is generated by Render on first sync (base64 of 256 random bits) and never
# lives in git. APNs values are entered in the dashboard (sync: false).
# After the first sync, move each service into its environment (prod / staging) in the Keyala
# project; Render keeps that placement on later syncs.

services:
  - type: web
    name: masterkey-prod
    runtime: docker
    plan: starter # Joseph upgraded compute in the dashboard (0.5c-512mb); matches `starter`
    disk:
      name: disk
      mountPath: /var/data
      sizeGB: 1
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: MK_MASTER_KEY # generated once per service; prod and staging never share it
        generateValue: true
      - key: KEYALA_DATABASE_URL # on the persistent disk
        value: sqlite:///var/data/masterkey.db?mode=rwc
      - key: KEYALA_BACKUP_DIR # same disk: protects against mistakes and bad deploys, not disk loss
        value: /var/data/backups
      - key: KEYALA_BACKUP_KEEP
        value: "7"
      - key: KEYALA_BACKUP_INTERVAL_SECS
        value: "86400"
      - key: KEYALA_PUBLIC_URL # base of connect/enroll links, QR codes and the OpenRouter callback
        value: https://app.keyala.io
      - key: KEYALA_DEV_LOGIN # 1 = anyone can log in as any email. Never with real keys.
        value: "0"
      - key: KEYALA_VENDOR_MOCK # 0 = real OpenAI / Anthropic calls
        value: "0"
      - key: KEYALA_APPLE_BUNDLE_ID
        value: app.sorevan.masterkey
      - key: KEYALA_COUNTRY_HEADER # Render sits behind Cloudflare; developer reports group users by this
        value: cf-ipcountry
      - key: KEYALA_PUBLIC_APPS # browser apps re-created on every start
        value: '[{"id":"app_resume_tailor","name":"Resume Tailor","homepage":"https://keyala.io/examples/resume-tailor/","allowed_origins":["https://keyala.io","https://iamjoseph331.github.io"]},{"id":"app_interview_prepper","name":"Interview Prepper","homepage":"https://iamjoseph331.github.io/interview_prepper/","allowed_origins":["https://iamjoseph331.github.io"]}]'
      - key: KEYALA_APNS_TOPIC
        value: app.sorevan.masterkey
      - key: KEYALA_APNS_SANDBOX # App Store / TestFlight builds use production APNs
        value: "0"
      - key: KEYALA_APNS_KEY_P8 # contents of AuthKey_XXXX.p8; push stays off until all three are set
        sync: false
      - key: KEYALA_APNS_KEY_ID
        sync: false
      - key: KEYALA_APNS_TEAM_ID
        sync: false

  - type: web
    name: masterkey-staging
    runtime: docker
    plan: free
    region: singapore
    branch: staging
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: MK_MASTER_KEY # generated once per service; prod and staging never share it
        generateValue: true
      - key: KEYALA_DATABASE_URL # free plan: no disk, data resets on deploy/restart/sleep
        value: sqlite:///data/keyala.db?mode=rwc
      - key: KEYALA_PUBLIC_URL # base of connect/enroll links, QR codes and the OpenRouter callback
        value: https://staging.keyala.io
      - key: KEYALA_DEV_LOGIN # 1 = anyone can log in as any email. Never with real keys.
        value: "0"
      - key: KEYALA_VENDOR_MOCK # 0 = real OpenAI / Anthropic calls
        value: "0"
      - key: KEYALA_APPLE_BUNDLE_ID
        value: app.sorevan.masterkey
      - key: KEYALA_COUNTRY_HEADER # Render sits behind Cloudflare; developer reports group users by this
        value: cf-ipcountry
      - key: KEYALA_PUBLIC_APPS # browser apps re-created on every start (data resets on free plan)
        value: '[{"id":"app_resume_tailor","name":"Resume Tailor","homepage":"https://keyala.io/examples/resume-tailor/","allowed_origins":["https://keyala.io","https://iamjoseph331.github.io"]},{"id":"app_interview_prepper","name":"Interview Prepper","homepage":"https://iamjoseph331.github.io/interview_prepper/","allowed_origins":["https://iamjoseph331.github.io"]}]'
      - key: KEYALA_APNS_TOPIC
        value: app.sorevan.masterkey
      - key: KEYALA_APNS_SANDBOX # Xcode-installed development builds use sandbox APNs
        value: "1"
      - key: KEYALA_PASSWORD_LOGIN # staging QA account `username:sha256hex(password)`, entered in the dashboard
        sync: false
      - key: KEYALA_APNS_KEY_P8 # contents of AuthKey_XXXX.p8; push stays off until all three are set
        sync: false
      - key: KEYALA_APNS_KEY_ID
        sync: false
      - key: KEYALA_APNS_TEAM_ID
        sync: false
