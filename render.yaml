# Render Blueprint for the MasterKey backend.
# main -> masterkey-prod, staging -> masterkey-staging. `dev` is CI-only (no deploy).
#
# Free plan: no persistent disk, so the SQLite file lives on the instance's ephemeral filesystem and
# ALL DATA (users, stored API keys, grants, history) RESETS on every deploy, restart or spin-down
# (free services sleep after 15 min idle). Upgrade: `plan: starter` + a `disk:` mounted at /data.
#
# Secrets: MK_MASTER_KEY is generated by Render on first sync (base64 of 256 random bits) and never
# lives in git. APNs values are entered in the dashboard (sync: false).
# After the first sync, move each service into its environment (prod / staging) in the Masterkey
# project; Render keeps that placement on later syncs.

services:
  - type: web
    name: masterkey-prod
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: MK_MASTER_KEY # generated once per service; prod and staging never share it
        generateValue: true
      - key: MK_DATABASE_URL
        value: sqlite:///data/masterkey.db?mode=rwc
      # MK_PUBLIC_URL defaults to Render's RENDER_EXTERNAL_URL; set it only for a custom domain.
      - key: MK_DEV_LOGIN # 1 = anyone can log in as any email. Never with real keys.
        value: "0"
      - key: MK_VENDOR_MOCK # 0 = real OpenAI / Anthropic calls
        value: "0"
      - key: MK_APPLE_BUNDLE_ID
        value: app.sorevan.masterkey
      - key: MK_COUNTRY_HEADER # Render sits behind Cloudflare; developer reports group users by this
        value: cf-ipcountry
      - key: MK_PUBLIC_APPS # browser apps re-created on every start (data resets on free plan)
        value: '[{"id":"app_resume_tailor","name":"Resume Tailor","homepage":"https://iamjoseph331.github.io/MasterKey/examples/resume-tailor/","allowed_origins":["https://iamjoseph331.github.io"]}]'
      - key: MK_APNS_TOPIC
        value: app.sorevan.masterkey
      - key: MK_APNS_SANDBOX # App Store / TestFlight builds use production APNs
        value: "0"
      - key: MK_APNS_KEY_P8 # contents of AuthKey_XXXX.p8; push stays off until all three are set
        sync: false
      - key: MK_APNS_KEY_ID
        sync: false
      - key: MK_APNS_TEAM_ID
        sync: false

  - type: web
    name: masterkey-staging
    runtime: docker
    plan: free
    region: singapore
    branch: staging
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: MK_MASTER_KEY # generated once per service; prod and staging never share it
        generateValue: true
      - key: MK_DATABASE_URL
        value: sqlite:///data/masterkey.db?mode=rwc
      # MK_PUBLIC_URL defaults to Render's RENDER_EXTERNAL_URL; set it only for a custom domain.
      - key: MK_DEV_LOGIN # 1 = anyone can log in as any email. Never with real keys.
        value: "0"
      - key: MK_VENDOR_MOCK # 0 = real OpenAI / Anthropic calls
        value: "0"
      - key: MK_APPLE_BUNDLE_ID
        value: app.sorevan.masterkey
      - key: MK_COUNTRY_HEADER # Render sits behind Cloudflare; developer reports group users by this
        value: cf-ipcountry
      - key: MK_PUBLIC_APPS # browser apps re-created on every start (data resets on free plan)
        value: '[{"id":"app_resume_tailor","name":"Resume Tailor","homepage":"https://iamjoseph331.github.io/MasterKey/examples/resume-tailor/","allowed_origins":["https://iamjoseph331.github.io"]}]'
      - key: MK_APNS_TOPIC
        value: app.sorevan.masterkey
      - key: MK_APNS_SANDBOX # Xcode-installed development builds use sandbox APNs
        value: "1"
      - key: MK_APNS_KEY_P8 # contents of AuthKey_XXXX.p8; push stays off until all three are set
        sync: false
      - key: MK_APNS_KEY_ID
        sync: false
      - key: MK_APNS_TEAM_ID
        sync: false
